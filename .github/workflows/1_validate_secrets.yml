name: 1. Validate Secrets
run-name: Validate Secrets (${{ github.ref_name }})

# Read-only: checks that the org secrets are visible and usable, the App Store
# Connect API key works and Match-Secrets decrypts. Changes nothing at Apple.
# Manual only (workflow_call lets 2-4 run it first; callers bring their own secrets).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  access:
    name: Access
    # Never run in forks of this public repo.
    if: github.repository_owner == 'ClemensBene-loops'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Validate Access Token
        run: |
          # Validate Access Token (GH_PAT)
          set -o pipefail

          GH_PAT_CLASSIC_PATTERN='^ghp_[a-zA-Z0-9]{36}$'
          GH_PAT_FINE_GRAINED_PATTERN='^github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}$'

          if [ -z "$GH_PAT" ]; then
            failed=true
            echo "::error::The GH_PAT secret is empty for this repository. If it exists as an organization secret, allow this repository under Organization > Settings > Secrets and variables > Actions > GH_PAT > Repository access."
          else
            if [[ $GH_PAT =~ $GH_PAT_CLASSIC_PATTERN ]]; then
              provides_scopes=true
              echo "The GH_PAT secret is a structurally valid classic token."
            elif [[ $GH_PAT =~ $GH_PAT_FINE_GRAINED_PATTERN ]]; then
              echo "The GH_PAT secret is a structurally valid fine-grained token."
            else
              echo "The GH_PAT secret does not have a known token format."
            fi

            if ! scopes=$(curl -sS -f -I -H "Authorization: token $GH_PAT" https://api.github.com | { grep -i '^x-oauth-scopes:' || true; } | cut -d ' ' -f2- | tr -d '\r'); then
              failed=true
              echo "::error::Unable to connect to GitHub using the GH_PAT secret. Verify that the token exists and has not expired at https://github.com/settings/tokens."
            elif [[ $scopes =~ repo ]]; then
              echo "The GH_PAT secret has the repo scope."
            elif [ $provides_scopes ]; then
              failed=true
              echo "::error::The GH_PAT secret lacks the 'repo' scope required to read Match-Secrets (scopes: ${scopes:-none})."
            else
              echo "The GH_PAT secret works but does not expose scopes (fine-grained). Assuming Match-Secrets access; the next step verifies it."
            fi
          fi

          if [ $failed ]; then
            exit 2
          fi

      - name: Validate Match-Secrets
        run: |
          # Validate Match-Secrets (must exist and be private; never created here)
          set -o pipefail
          REPO=ClemensBene-loops/Match-Secrets

          if ! visibility=$(gh repo view "$REPO" --json visibility | jq --raw-output '.visibility | ascii_downcase'); then
            echo "::error::$REPO could not be read with GH_PAT. Check the token's access to that repository."
            exit 2
          elif [[ "$visibility" != "private" ]]; then
            echo "::error::$REPO is $visibility. It must be private."
            exit 2
          fi
          echo "Found private $REPO."

  fastlane:
    name: Fastlane
    needs: access
    if: github.repository_owner == 'ClemensBene-loops'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODE_VERSION: "26.5"
      GH_PAT: ${{ secrets.GH_PAT }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      TEAMID: ${{ secrets.TEAMID }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check Xcode
        run: |
          # Informational: the build workflow pins this Xcode.
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            echo "Pinned Xcode ${XCODE_VERSION} is available."
          else
            echo "::warning::/Applications/Xcode_${XCODE_VERSION}.app is not on this runner image; 4. Build will fall back to the newest installed Xcode."
          fi

      - name: Install Project Dependencies
        run: bundle install

      # Actions logs of a public repo are public: keep match from printing its
      # parameter tables and mask the derived git basic-auth header value.
      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH="$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb"
          if [ ! -f "$TABLE_PRINTER_PATH" ]; then
            echo "::error::table_printer.rb not found"
            exit 1
          fi
          sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          if grep -q "puts(Terminal::Table.new(params))" "$TABLE_PRINTER_PATH"; then
            echo "::error::Patching table_printer.rb failed"
            exit 1
          fi

      - name: Mask derived credentials
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "::add-mask::$(printf '%s' "${GITHUB_REPOSITORY_OWNER}:${GH_PAT}" | openssl base64 -A)"
          fi

      # Workaround for runner clock drift (https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Validate Fastlane Secrets
        run: |
          # Validate Fastlane Secrets
          HINT="If it exists as an organization secret, allow this repository under Organization > Settings > Secrets and variables > Actions > (secret) > Repository access."

          if [ -z "$TEAMID" ]; then
            failed=true
            echo "::error::The TEAMID secret is empty for this repository. $HINT"
          elif ! [[ $TEAMID =~ ^[A-Z0-9]{10}$ ]]; then
            failed=true
            echo "::error::The TEAMID secret is set but invalid (expected 10 uppercase letters/digits)."
          fi

          if [ -z "$MATCH_PASSWORD" ]; then
            failed=true
            echo "::error::The MATCH_PASSWORD secret is empty for this repository. $HINT"
          fi

          set -o pipefail
          FASTLANE_KEY_ID_PATTERN='^[A-Z0-9]{10}$'
          FASTLANE_ISSUER_ID_PATTERN='^\{?[A-F0-9a-f]{8}-[A-F0-9a-f]{4}-[A-F0-9a-f]{4}-[A-F0-9a-f]{4}-[A-F0-9a-f]{12}\}?$'

          if [ -z "$FASTLANE_ISSUER_ID" ] || [ -z "$FASTLANE_KEY_ID" ] || [ -z "$FASTLANE_KEY" ]; then
            failed=true
            [ -z "$FASTLANE_ISSUER_ID" ] && echo "::error::The FASTLANE_ISSUER_ID secret is empty for this repository. $HINT"
            [ -z "$FASTLANE_KEY_ID"    ] && echo "::error::The FASTLANE_KEY_ID secret is empty for this repository. $HINT"
            [ -z "$FASTLANE_KEY"       ] && echo "::error::The FASTLANE_KEY secret is empty for this repository. $HINT"
          elif ! [[ $FASTLANE_KEY_ID =~ $FASTLANE_KEY_ID_PATTERN ]]; then
            failed=true
            echo "::error::The FASTLANE_KEY_ID secret is set but invalid."
          elif ! [[ $FASTLANE_ISSUER_ID =~ $FASTLANE_ISSUER_ID_PATTERN ]]; then
            failed=true
            echo "::error::The FASTLANE_ISSUER_ID secret is set but invalid."
          elif ! echo "$FASTLANE_KEY" | openssl pkcs8 -nocrypt >/dev/null; then
            failed=true
            echo "::error::The FASTLANE_KEY secret is set but is not a valid .p8 key."
          fi

          if [ $failed ]; then
            exit 2
          fi

          if ! bundle exec fastlane validate_secrets 2>&1 | tee fastlane.log; then
            if grep -q "Couldn't decrypt the repo" fastlane.log; then
              echo "::error::Unable to decrypt Match-Secrets with MATCH_PASSWORD."
            elif grep -q -e "required agreement" -e "license agreement" fastlane.log; then
              echo "::error::Accept the latest Apple Developer Program License Agreement at https://developer.apple.com/account, then retry."
            elif grep -q "Your certificate .* is not valid" fastlane.log; then
              echo "::error::The shared distribution certificate in Match-Secrets is invalid or expired. Renew it via Loop's workflow, not here."
            else
              echo "::error::fastlane validate_secrets failed, see log above."
            fi
            exit 2
          fi
