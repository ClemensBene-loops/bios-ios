name: 3. Create Certificates
run-name: Create Certificates (${{ github.ref_name }})

# Apple-side change: creates the App Store provisioning profile for
# at.bene.bios and stores it in Match-Secrets. REUSES the distribution
# certificate shared with Loop; never creates, renews or revokes certificates.
# Deliberately no nuke job (unlike LoopWorkspace). Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-provisioning
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    if: github.repository_owner == 'ClemensBene-loops'
    uses: ./.github/workflows/1_validate_secrets.yml
    secrets: inherit

  certs:
    name: Certificates
    needs: validate
    if: github.repository_owner == 'ClemensBene-loops'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Project Dependencies
        run: bundle install

      # Actions logs of a public repo are public: keep match from printing its
      # parameter tables and mask the derived git basic-auth header value.
      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH="$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb"
          if [ ! -f "$TABLE_PRINTER_PATH" ]; then
            echo "::error::table_printer.rb not found"
            exit 1
          fi
          sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          if grep -q "puts(Terminal::Table.new(params))" "$TABLE_PRINTER_PATH"; then
            echo "::error::Patching table_printer.rb failed"
            exit 1
          fi

      - name: Mask derived credentials
        run: echo "::add-mask::$(printf '%s' "${GITHUB_REPOSITORY_OWNER}:${GH_PAT}" | openssl base64 -A)"

      # Workaround for runner clock drift (https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Certs (profile only, certificate reused)
        run: bundle exec fastlane certs
