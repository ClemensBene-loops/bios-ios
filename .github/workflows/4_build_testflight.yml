name: 4. Build BIOS
run-name: Build BIOS (${{ github.ref_name }})

# Builds a signed App Store IPA and uploads it to TestFlight. Needs 2 + 3 and
# an App Store Connect app record for at.bene.bios. Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-testflight
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    if: github.repository_owner == 'ClemensBene-loops'
    uses: ./.github/workflows/1_validate_secrets.yml
    secrets: inherit

  build:
    name: Build
    needs: validate
    if: github.repository_owner == 'ClemensBene-loops'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE_VERSION: "26.5"
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
    steps:
      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app || true
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE" ]; then
            XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)"
            echo "::warning::Xcode ${XCODE_VERSION} not found on this runner, using ${XCODE:-the runner default}."
          fi
          if [ -n "$XCODE" ]; then
            sudo xcode-select --switch "$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version
          xcodegen generate

      # Optional build-time config (GitHub secrets, may be empty). Written into
      # the runner's copy of Config/Info.plist only; never committed.
      - name: Inject app config
        env:
          BIOS_API_BASE_URL: ${{ secrets.BIOS_API_BASE_URL }}
          BIOS_API_SECRET: ${{ secrets.BIOS_API_SECRET }}
        run: |
          if [ -n "$BIOS_API_BASE_URL" ]; then
            plutil -replace BIOSAPIBaseURL -string "$BIOS_API_BASE_URL" Config/Info.plist
            echo "BIOS_API_BASE_URL injected."
          else
            echo "BIOS_API_BASE_URL not set, leaving it empty."
          fi
          if [ -n "$BIOS_API_SECRET" ]; then
            plutil -replace BIOSAPISecret -string "$BIOS_API_SECRET" Config/Info.plist
            echo "BIOS_API_SECRET injected."
          else
            echo "BIOS_API_SECRET not set, leaving it empty."
          fi
          plutil -lint Config/Info.plist

      - name: Install Project Dependencies
        run: bundle install

      # Actions logs of a public repo are public: keep match from printing its
      # parameter tables and mask the derived git basic-auth header value.
      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH="$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb"
          if [ ! -f "$TABLE_PRINTER_PATH" ]; then
            echo "::error::table_printer.rb not found"
            exit 1
          fi
          sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          if grep -q "puts(Terminal::Table.new(params))" "$TABLE_PRINTER_PATH"; then
            echo "::error::Patching table_printer.rb failed"
            exit 1
          fi

      - name: Mask derived credentials
        run: echo "::add-mask::$(printf '%s' "${GITHUB_REPOSITORY_OWNER}:${GH_PAT}" | openssl base64 -A)"

      # Workaround for runner clock drift (https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build

      - name: Verify push entitlement is production
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          unzip -q build/BIOS.ipa -d "$WORK"
          APP="$(ls -d "$WORK"/Payload/*.app | head -n 1)"
          codesign -d --entitlements - --xml "$APP" > "$WORK/ent.plist" 2>/dev/null
          plutil -p "$WORK/ent.plist"
          APS="$(plutil -extract aps-environment raw -o - "$WORK/ent.plist")"
          if [ "$APS" != "production" ]; then
            echo "::error::aps-environment is '$APS', expected 'production'."
            exit 1
          fi
          echo "aps-environment = production"

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release

      # Build log only, and only on failure. The IPA is NOT uploaded: this repo
      # is public and the IPA may contain BIOS_API_SECRET.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: buildlog
          path: buildlog
          retention-days: 7
          if-no-files-found: ignore
